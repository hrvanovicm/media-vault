version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    colored-line-number: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # Often adds churn for micro-optimizations; enable manually if memory alignment is critical.
  revive:
    severity: error
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: empty-block
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: superfluous-else
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: unused-parameter
      - name: var-declaration
      - name: var-naming

  gocyclo:
    min-complexity: 15

  gocognit:
    min-complexity: 20

  dupl:
    threshold: 150

  goconst:
    min-len: 3
    min-occurrences: 3

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Errors unhandled (handled explicitly by errcheck).

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      - hugeParam
      - rangeValCopy
      - unnamedResult

  nolintlint:
    allow-unused: false
    allow-no-explanation: []
    require-explanation: true
    require-specific: true

linters:
  disable-all: true
  enable:
    # --- Core & Correctness ---
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - nilerr
    - errorlint
    - noctx
    - rowserrcheck
    - sqlclosecheck

    # --- Security ---
    - gosec

    # --- Code Style & Complexity ---
    - revive
    - gocritic
    - gocyclo
    - gocognit
    - goconst
    - dupl
    - misspell
    - unconvert
    - unparam
    - prealloc
    - whitespace
    - nolintlint

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Exclude strict checks in test files.
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - goconst
        - errcheck
        - noctx

    # Exclude shadowing checks inside main initialization blocks.
    - path: cmd/
      linters:
        - goconst

    # Allow unhandled Close() in deferred statements if error is ignored intentionally.
    - text: "Error return value of `.*Close` is not checked"
      linters:
        - errcheck